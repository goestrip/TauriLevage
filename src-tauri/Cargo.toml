[package]
name = "suivi_materiel"
version = "0.1.0"
description = "Une app pour suivre les incidents materiels"
authors = ["PBV"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "levage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.40", features = ["serde"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
configparser = "3.0.5"
tauri-plugin-log = "2.10.1"
log = "0.4"
tauri-plugin-dialog = "2.8.3"
